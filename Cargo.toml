[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
wkdash-core = { path = "crates/wkdash-core" }

chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

worker = { version = "0.8.5" }
sha2 = "0.10"
hex = "0.4"
console_error_panic_hook = "0.1"

futures = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
