<!doctype html>
<!--
  GitHub Pages page. The dashboard now lives on Cloudflare (see wrangler.toml, site in public/).
  This page forwards the old github.io URL there — and, because it runs on the old origin, it is
  the only place that can still read the review history the old version collected in this
  browser's IndexedDB. If there is any, it offers to upload it to the new site's server first.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>WaniKani Dashboard has moved</title>
<noscript><meta http-equiv="refresh" content="0; url=https://wkdash.utterstep.app/"></noscript>
<link rel="stylesheet" href="public/styles.css">
<style>
  main { max-width: 560px; margin: 10vh auto; padding: 0 16px; }
  .panel p { margin: 10px 0; }
  .dialog-actions { margin-top: 18px; }
</style>
</head>
<body>
<main>
  <section class="panel" id="migrate" hidden>
    <h2>The dashboard moved to wkdash.utterstep.app</h2>
    <p id="msg"></p>
    <p class="note">Upload it and the new site carries on from where this browser left off. Skip it and history on the new site starts today.</p>
    <div class="dialog-actions">
      <button id="upload" class="btn primary">Upload history, then continue</button>
      <a id="go" class="btn">Continue without uploading</a>
    </div>
    <p id="err" class="note"></p>
  </section>
  <section class="panel" id="plain" hidden>
    <p>The dashboard moved to <a id="go2" href="https://wkdash.utterstep.app/">wkdash.utterstep.app</a>.</p>
  </section>
</main>
<script type="module">
  import { openDb } from './public/js/db.js';
  import { hasLocalHistory, collectSeed } from './public/js/pull.js';
  import { ServerApi } from './public/js/server.js';

  const NEW = 'https://wkdash.utterstep.app';
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const MOCK = params.has('mock'); // tests: fake server in-page, no real redirect
  params.delete('legacy'); params.delete('mock');
  const qs = params.toString();
  const target = `${NEW}/${qs ? `?${qs}` : ''}${location.hash}`;
  const leave = () => { if (MOCK) { $('plain').hidden = false; $('plain').dataset.done = '1'; } else location.replace(target); };

  let serverFetch;
  if (MOCK) ({ server: serverFetch } = await (await import('./tests/mock-api.js')).installMock(params.get('mock') ?? 'a'));
  for (const a of [$('go'), $('go2')]) a.href = target;

  const key = localStorage.getItem('wk_api_key');
  const db = await openDb();
  if (!key || !(await hasLocalHistory(db))) { leave(); }
  else {
    const since = new Date(await db.getMeta('history_since')).toLocaleDateString();
    $('msg').textContent = `This browser holds review history since ${since} (${await db.count('syncs')} syncs) that only exists here.`;
    $('migrate').hidden = false;
    $('upload').addEventListener('click', async () => {
      $('upload').disabled = true;
      $('err').textContent = 'Uploading…';
      try {
        const server = new ServerApi(key, { base: MOCK ? '/api' : `${NEW}/api`, fetch: serverFetch });
        const st = await server.state(0);
        if (st.account.status !== 'empty') {
          $('err').textContent = 'The new site already has history for this account, so nothing was uploaded.';
        } else {
          await server.seed(await collectSeed(db));
          $('err').textContent = 'Uploaded.';
        }
        await db.setMeta('server_version', 0); // don't offer again
        leave();
      } catch (e) {
        $('upload').disabled = false;
        $('err').textContent = e.name === 'AuthError' ? 'WaniKani rejected the token stored here; open the new site and paste a fresh one instead.' : `Upload failed: ${e.message}. Try again, or continue without uploading.`;
      }
    });
  }
</script>
</body>
</html>
